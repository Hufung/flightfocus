<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy -->
    <title>Flight Focus - Inflight</title
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></noscript>

    <link rel="stylesheet" href="tailwind.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- CRITICAL AND DEFERRED CSS: Retaining the necessary styles from the original index.html -->
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-color: #111827;
            color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .screen {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 5;
        }

        .screen.is-active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111827;
            z-index: 100;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #374151;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Website Blocker Overlay */
        #website-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .blocker-content {
            max-width: 500px;
            background: #1f2937;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .blocker-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Basic styling for initial content */
        .bg-gray-900 { background-color: #111827; }
        .text-white { color: white; }
        .antialiased { -webkit-font-smoothing: antialiased; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .min-h-screen { min-height: 100vh; }
        .w-full { width: 100%; }
        .h-screen { height: 100vh; }
        .flex-col { flex-direction: column; }
        .hidden { display: none; }
        
        /* Rest of your CSS styles */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        button {
            transition: transform 0.1s ease-out, background-color 0.2s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        /* NEW/MODIFIED TICKET STYLES AND ANIMATIONS */
        
        .boarding-pass-container {
            perspective: 1200px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); /* Enhanced shadow for realism */
        }
        
        #ticket-top, #ticket-bottom {
            transition: transform 1.5s cubic-bezier(0.6, -0.28, 0.735, 0.045);
            background-color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05); /* Inner shadow for depth */
        }

        /* Wobble (slightly faster) */
        @keyframes ticket-wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-0.5deg); }
            50% { transform: rotate(0.5deg); }
            75% { transform: rotate(-0.25deg); }
            100% { transform: rotate(0deg); }
        }

        .wobble-animation {
            animation: ticket-wobble 0.4s ease-in-out; /* Adjusted timing */
        }

        /* Tearing animation (using the original keyframes) */
        @keyframes tear-top-realistic {
            0% {
                transform: rotateZ(0) rotateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                /* Increased rotation and translation for dramatic effect */
                transform: rotateZ(-20deg) rotateX(30deg) translateY(-200%) translateX(-30%);
                opacity: 0;
            }
        }

        @keyframes tear-bottom-realistic {
            0% {
                transform: rotateZ(0) rotateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                /* Increased rotation and translation for dramatic effect */
                transform: rotateZ(15deg) rotateX(-25deg) translateY(200%) translateX(30%);
                opacity: 0;
            }
        }

        .tear-top-animation {
            transform-origin: top center;
            animation: tear-top-realistic 1.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        .tear-bottom-animation {
            transform-origin: bottom center;
            animation: tear-bottom-realistic 1.5s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }
        
        /* Utility styles for map/dashboard */
        .leaflet-popup-content-wrapper {
            background-color: #1f2937;
            color: #f3f4f6;
            border-radius: 8px;
        }

        .leaflet-popup-content {
            margin: 12px 18px;
            font-size: 14px;
        }

        .leaflet-popup-tip {
            background: #1f2937;
        }
        
        .inflight-tooltip {
            background-color: #1f2937e0;
            color: #f3f4f6;
            border: none;
            border-radius: 4px;
            box-shadow: none;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .leaflet-tooltip-top.inflight-tooltip::before {
            display: none;
        }

        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            background-color: #374151 !important;
            color: #f9fafb !important;
            border-color: #4b5563 !important;
        }

        .leaflet-control-zoom-in:hover,
        .leaflet-control-zoom-out:hover {
            background-color: #4b5563 !important;
        }

        .compact-button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            font-weight: 500;
            min-height: auto;
        }
        
        .compact-footer {
            padding: 1rem;
        }
    </style>
</head>

<body class="bg-gray-900 text-white antialiased flex items-center justify-center min-h-screen" onload="g()">
    <div id="loading-screen" class="screen is-active loading-screen" >
        <div class="loader"></div>
        <h2 class="text-xl font-bold">Flight Focus</h2>
        <p class="text-gray-400 mt-2">Preparing for takeoff...</p>
    </div>
    <script>
        function g() {
            alert('The url of the website have be change.');
            location.replace("https://trainfocus.free.nf/")
            
}
    </script>
</body>
</html>
